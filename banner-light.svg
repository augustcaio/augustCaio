<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="title">
  <title id="title">Caio Augusto - Full Stack Developer</title>
  <style>
    text { font-family: ui-monospace, "JetBrainsMono Nerd Font", "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 18px; fill: #1f1f1f; }
    .dim { fill: #8c8c8c; }
    .mid { fill: #4d4d4d; }
    .user { font-weight: 700; fill: #1278ad; }
    .name { font-size: 40px; font-weight: 700; }
    .role { font-size: 21px; fill: #1278ad; }
    .small { font-size: 15px; }

    /* Cada caractere surge no seu proprio instante (animation-delay inline) */
    .ch { animation-name: hidden; animation-duration: 0.01s; animation-fill-mode: backwards; }

    /* Saidas e prompts seguintes aparecem de uma vez, como num terminal real */
    .out1, .p2 { animation: hidden 0.01s 2.095s backwards; }
    .out2, .p3 { animation: hidden 0.01s 5.712s backwards; }

    /* Cursores: o 1 e o 2 so existem enquanto sua linha esta ativa; o 3 fica piscando */
    .c1, .c2 { opacity: 0; }
    /* Pisca uma vez na pausa antes de digitar, depois fica fixo enquanto digita */
    .c1 { animation: visible 2.095s 0s, idle 1s steps(1, end) 0s; }
    .c2 { animation: visible 3.617s 2.095s, idle 1.2s steps(1, end) 2.095s; }
    .m1 { animation: move1 0.655s steps(1, end) 0.99s both; }
    .m2 { animation: move2 1.977s steps(1, end) 3.285s both; }
    .c3 { animation: hidden 0.01s 5.712s backwards, blink 1.1s steps(1) 5.712s infinite; }

    @keyframes hidden { from, to { opacity: 0; fill-opacity: 0; } }
    @keyframes visible { from, to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes idle { 0% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes move1 { 0% { transform: translateX(0); } 1.53% { transform: translateX(10.8px); } 21.07% { transform: translateX(21.6px); } 45.95% { transform: translateX(32.4px); } 65.80% { transform: translateX(43.2px); } 85.04% { transform: translateX(54px); } 100.00% { transform: translateX(64.8px); } }
    @keyframes move2 { 0% { transform: translateX(0); } 0.51% { transform: translateX(10.8px); } 10.12% { transform: translateX(21.6px); } 18.16% { transform: translateX(32.4px); } 27.62% { transform: translateX(43.2px); } 44.36% { transform: translateX(54px); } 52.35% { transform: translateX(64.8px); } 59.84% { transform: translateX(75.6px); } 63.38% { transform: translateX(86.4px); } 72.43% { transform: translateX(97.2px); } 84.67% { transform: translateX(108px); } 92.92% { transform: translateX(118.8px); } 96.46% { transform: translateX(129.6px); } 100.00% { transform: translateX(140.4px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Janela no estilo GNOME: header bar com titulo centralizado e botoes a direita -->
  <rect x="0.5" y="0.5" width="899" height="289" rx="8" fill="#fafafa" stroke="#d6d6d6"/>
  <path d="M8.5 0.5 H891.5 A8 8 0 0 1 899.5 8.5 V40.5 H0.5 V8.5 A8 8 0 0 1 8.5 0.5 Z" fill="#ececec"/>
  <line x1="0.5" y1="40.5" x2="899.5" y2="40.5" stroke="#d6d6d6"/>
  <text x="450" y="26" text-anchor="middle" class="small" style="font-weight:700">caio@arch: ~</text>
  <g fill="#d6d6d6" stroke="#1f1f1f" stroke-width="1.5" stroke-linecap="round">
    <circle cx="815" cy="20.5" r="10" stroke="none"/>
    <circle cx="843" cy="20.5" r="10" stroke="none"/>
    <circle cx="871" cy="20.5" r="10" stroke="none"/>
    <line x1="811" y1="24" x2="819" y2="24"/>
    <rect x="839" y="16.5" width="8" height="8" fill="none"/>
    <path d="M867.5 17 L874.5 24 M874.5 17 L867.5 24"/>
  </g>

  <!-- caio@arch:~$ whoami -->
  <text x="32" y="82" class="" textLength="151.2" lengthAdjust="spacing"><tspan class="dim">[</tspan><tspan class="user">caio@arch</tspan> ~<tspan class="dim">]$</tspan></text>
  <text x="194" y="82" textLength="64.8" lengthAdjust="spacing" xml:space="preserve"><tspan class="ch" style="animation-delay:1s">w</tspan><tspan class="ch" style="animation-delay:1.128s">h</tspan><tspan class="ch" style="animation-delay:1.291s">o</tspan><tspan class="ch" style="animation-delay:1.421s">a</tspan><tspan class="ch" style="animation-delay:1.547s">m</tspan><tspan class="ch" style="animation-delay:1.645s">i</tspan></text>
  <g class="m1"><rect class="c1" x="194" y="67" width="10" height="20" fill="#1f1f1f"/></g>

  <g class="out1">
    <text x="32" y="128" class="name">Caio Augusto</text>
    <text x="32" y="160" class="role">Full Stack Developer<tspan class="dim"> · Brazil</tspan></text>
  </g>

  <!-- caio@arch:~$ cat stack.txt -->
  <g class="p2">
    <text x="32" y="204" class="" textLength="151.2" lengthAdjust="spacing"><tspan class="dim">[</tspan><tspan class="user">caio@arch</tspan> ~<tspan class="dim">]$</tspan></text>
    <text x="194" y="204" textLength="140.4" lengthAdjust="spacing" xml:space="preserve"><tspan class="ch" style="animation-delay:3.295s">c</tspan><tspan class="ch" style="animation-delay:3.485s">a</tspan><tspan class="ch" style="animation-delay:3.644s">t</tspan><tspan class="ch" style="animation-delay:3.831s"> </tspan><tspan class="ch" style="animation-delay:4.162s">s</tspan><tspan class="ch" style="animation-delay:4.32s">t</tspan><tspan class="ch" style="animation-delay:4.468s">a</tspan><tspan class="ch" style="animation-delay:4.538s">c</tspan><tspan class="ch" style="animation-delay:4.717s">k</tspan><tspan class="ch" style="animation-delay:4.959s">.</tspan><tspan class="ch" style="animation-delay:5.122s">t</tspan><tspan class="ch" style="animation-delay:5.192s">x</tspan><tspan class="ch" style="animation-delay:5.262s">t</tspan></text>
  </g>
  <g class="m2"><rect class="c2" x="194" y="189" width="10" height="20" fill="#1f1f1f"/></g>

  <text x="32" y="234" class="out2 small">TypeScript<tspan class="dim"> · </tspan>React<tspan class="dim"> · </tspan>Next.js<tspan class="dim"> · </tspan>Python<tspan class="dim"> · </tspan>FastAPI<tspan class="dim"> · </tspan>Flutter<tspan class="dim"> · </tspan>Docker<tspan class="dim"> · </tspan>Linux</text>

  <!-- Prompt final com cursor piscando -->
  <g class="p3"><text x="32" y="270" class="" textLength="151.2" lengthAdjust="spacing"><tspan class="dim">[</tspan><tspan class="user">caio@arch</tspan> ~<tspan class="dim">]$</tspan></text></g>
  <rect class="c3" x="194" y="255" width="10" height="20" fill="#1f1f1f"/>
</svg>
